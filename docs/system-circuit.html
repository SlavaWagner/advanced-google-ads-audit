<style>
  .swa-circuit-container {
    --bg: #050505;
    --border: #14161c;
    --ink: #ffffff;
    --ink-dim: #7f8694;
    
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    position: relative;
    overflow: hidden;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    box-sizing: border-box;
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
    font-family: inherit !important;
  }
  
  .swa-circuit-container::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
  }

  .swa-circuit-wrapper {
    width: 100%;
    position: relative;
    z-index: 2;
  }
  
  .swa-circuit-svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .dbt-node {
    stroke: var(--border);
    stroke-width: 1.2;
    fill: #08090d;
    rx: 0;
    ry: 0;
    transition: stroke 0.3s, fill 0.3s;
  }

  .node-group:hover .dbt-node {
    stroke: #60a5fa;
    fill: #0d0f14;
  }

  .dbt-node-icon {
    fill: #11131a;
    rx: 0;
    ry: 0;
  }
</style>
